name: Aivtomation Cloud Media Worker (Failover)

on:
  repository_dispatch:
    types: [media_job, stt_job, poll_jobs]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Specific Job ID to render (optional)'
        required: false
        default: ''
      server_url:
        description: 'Server API endpoint'
        required: false
        default: 'https://aivtomation.com/crossposting/app/media_worker_api.php'
  schedule:
    # Auto-check every 30 minutes to clean up any waiting jobs if PC was turned off
    - cron: '*/30 * * * *'

concurrency:
  group: media-worker-queue
  cancel-in-progress: false

jobs:
  render_job:
    name: Video Render & Subtitle Engine
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig fonts-dejavu-core fonts-liberation
          mkdir -p ~/.local/share/fonts
          sudo mkdir -p /usr/share/fonts/truetype/custom
          cp media_worker/fonts/*.ttf ~/.local/share/fonts/ 2>/dev/null || true
          sudo cp media_worker/fonts/*.ttf /usr/share/fonts/truetype/custom/ 2>/dev/null || true
          fc-cache -fv

      - name: Install Python Dependencies
        run: |
          pip install -r media_worker/requirements.txt

      - name: Execute Media Processing Task
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AIV_SECRET_KEY: ${{ secrets.AIV_SECRET_KEY || 'run_cron_123' }}
          AIV_SERVER_URL: ${{ github.event.client_payload.server_url || inputs.server_url || 'https://aivtomation.com/crossposting/app/media_worker_api.php' }}
          TARGET_JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id || '' }}
        run: |
          python media_worker/github_worker.py

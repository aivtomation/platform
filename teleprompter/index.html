<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Teleprompter | aivtomation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
    <!-- PeerJS для WebRTC (віддалене керування) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- Editor/Settings View -->
      <div id="editor-view" class="view active">
        <header>
          <div class="header-content">
            <h1>AI Teleprompter</h1>
            <p class="subtitle">Голосові команди: <strong>"суфлер старт"</strong>, <strong>"суфлер стоп"</strong>, <strong>"суфлер швидше"</strong>, <strong>"суфлер вгору"</strong></p>
          </div>
        </header>
        
        <main class="editor-main">
          <div class="control-panel glass-panel">
            <h2>Налаштування</h2>
            <div class="control-group">
              <label for="speed-slider">Швидкість прокрутки: <span id="speed-value">18</span></label>
              <input type="range" id="speed-slider" min="1" max="100" value="18">
            </div>
            <div class="control-group">
              <label for="size-slider">Розмір шрифту: <span id="size-value">40</span>px</label>
              <input type="range" id="size-slider" min="20" max="150" value="40">
            </div>
            <div class="control-group row-group">
              <label class="toggle-switch">
                <input type="checkbox" id="mirror-x">
                <span class="slider round"></span>
              </label>
              <span class="toggle-label">Дзеркало Горизонталь ↔</span>
            </div>
            <div class="control-group row-group">
              <label class="toggle-switch">
                <input type="checkbox" id="mirror-y">
                <span class="slider round"></span>
              </label>
              <span class="toggle-label">Дзеркало Вертикаль ↕</span>
            </div>
            <div class="control-group">
              <label for="layout-select">Розташування тексту</label>
              <select id="layout-select">
                <option value="layout-full">На весь екран</option>
                <option value="layout-left">Зліва (для смартфона)</option>
                <option value="layout-right">Справа (для смартфона)</option>
              </select>
            </div>
            
            <div class="control-group remote-group">
              <label>Віддалене керування (Синхронізація)</label>
              <div class="remote-buttons">
                <button id="btn-mode-local" class="btn-secondary active">Автономно</button>
                <button id="btn-mode-host" class="btn-secondary">Екран (Телефон)</button>
                <button id="btn-mode-remote" class="btn-secondary">Пульт (ПК)</button>
              </div>
              
              <!-- Панель Екрану -->
              <div id="host-panel" class="remote-panel hidden">
                <p>Код для підключення пульта:</p>
                <h3 id="host-code">----</h3>
                <p id="host-status" class="status waiting">Очікування пульта...</p>
              </div>

              <!-- Панель Пульта -->
              <div id="remote-panel" class="remote-panel hidden">
                <input type="text" id="remote-code-input" placeholder="Введіть код з екрану (4 цифри)" maxlength="4" style="width: 100%; text-align: center; font-size: 1.2rem; letter-spacing: 5px; margin-bottom: 0.5rem;">
                <button id="btn-connect" class="btn-primary" style="padding: 0.5rem; font-size: 1rem; width: 100%; margin-top: 0;">Підключитись</button>
                <p id="remote-status" class="status" style="margin-top: 0.5rem;">Не підключено</p>
              </div>
            </div>

            <button id="start-btn" class="btn-primary">Запустити</button>
            <div id="voice-indicator-editor" class="voice-status">🎤 Голосове управління активно</div>
          </div>
          
          <div class="editor-container glass-panel">
            <textarea id="text-input" placeholder="Вставте ваш текст сюди..."></textarea>
          </div>
        </main>
      </div>

      <!-- Prompter View -->
      <div id="prompter-view" class="view">
        <div id="prompter-container" class="layout-full">
          <div id="prompter-text"></div>
        </div>
        <div class="prompter-overlay">
          <div class="prompter-speed-control">
            <input type="range" id="prompter-speed-slider" min="1" max="100" value="18" orient="vertical">
          </div>
          <button id="stop-btn" class="btn-icon" title="Зупинити / Редагувати">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
          </button>
          <div id="voice-status" class="voice-status listening">🎤 Слухаю...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
